# SFT (Supervised Fine-Tuning) Configuration
# 基于 Qwen3-0.6B 的安全对齐训练配置

# Model Settings
model:
  base_model: "Qwen/Qwen3-0.6B"  # 或本地路径 models/base/
  model_max_length: 2048
  use_lora: true  # 建议使用 LoRA 节省显存

# LoRA Settings (仅当 use_lora: true 时生效)
lora:
  r: 16                    # LoRA rank，小模型可用较小值
  lora_alpha: 32           # 缩放参数
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

# Training Settings
training:
  output_dir: "models/sft"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4      # LoRA 可用较大学习率
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  save_steps: 100
  save_total_limit: 3
  logging_steps: 10
  eval_steps: 50
  evaluation_strategy: "steps"
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  gradient_checkpointing: true
  fp16: true                 # 或 bf16（如果支持）
  seed: 42

# Data Settings
data:
  train_file: "data/processed/sft_train.json"
  eval_file: "data/processed/sft_eval.json"
  max_seq_length: 2048
  template: "chatml"         # Qwen 使用 ChatML 格式

# Logging
logging:
  use_wandb: false
  wandb_project: "patient-safety-sft"
  wandb_run_name: "qwen3-0.6b-sft"
  report_to: ["tensorboard"]
